<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Badminton 3D Court - Step 1</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071721; color: #ecfcf7; }
    #app { width: 100%; height: 100%; display: block; }
    .header { position: fixed; left: 24px; top: 22px; pointer-events: none; }
    .eyebrow { color: #7ce3cc; letter-spacing: .15em; font-size: 11px; font-weight: 750; margin: 0 0 10px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 34px); font-weight: 730; letter-spacing: -.05em; }
    .subtitle { color: #acc2c9; font-size: 13px; margin-top: 8px; }
    .panel { position: fixed; right: 24px; top: 24px; width: 245px; padding: 18px; border: 1px solid rgba(197,255,239,.14); border-radius: 18px; background: rgba(4,21,30,.74); backdrop-filter: blur(17px); box-shadow: 0 16px 48px rgba(0,0,0,.18); }
    .panel-title { text-transform: uppercase; color: #90b4b7; font-weight: 750; letter-spacing: .11em; font-size: 10px; margin: 0 0 12px; }
    .metric { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; font-size: 12px; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .metric span:first-child { color: #9ab6be; }
    .metric strong { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
    .buttons { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; cursor: pointer; border: 1px solid rgba(136,236,208,.35); border-radius: 10px; color: #def9f3; background: rgba(49,133,116,.28); font-size: 12px; font-weight: 650; min-height: 36px; }
    button:hover, button:focus-visible { background: rgba(66,172,144,.56); outline: none; }
    .footer { position: fixed; bottom: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: #9abdc0; font-size: 12px; pointer-events: none; }
    .pill { border: 1px solid rgba(144,211,190,.2); padding: 8px 12px; background: rgba(5,24,33,.69); border-radius: 99px; }
    .status { color: #88edc9; }
    .panel { max-height: calc(100vh - 48px); overflow-y: auto; }
    .section + .section { margin-top: 18px; }
    .seg { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: rgba(0,0,0,.22); }
    .seg button { white-space: nowrap; min-height: 32px; border-color: transparent; background: transparent; }
    .seg button.active { background: rgba(66,172,144,.6); border-color: rgba(136,236,208,.5); }
    .hint { color: #9ab6be; font-size: 11.5px; line-height: 1.45; margin: 10px 0 0; }
    form { margin: 10px 0 0; display: grid; gap: 8px; }
    [hidden] { display: none !important; }
    form label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: #9ab6be; }
    form input { width: 92px; padding: 7px 8px; border-radius: 8px; border: 1px solid rgba(136,236,208,.3); background: rgba(0,0,0,.28); color: #ecfcf7; font: inherit; font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    form input:focus { outline: none; border-color: #7ce3cc; }
    form small { color: #7f9aa1; font-size: 10.5px; line-height: 1.4; }
    .err { color: #ff9f9f; font-size: 11px; min-height: 0; }
    .result { margin-top: 12px; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.22); font-size: 12px; display: grid; gap: 5px; }
    .result div { display: flex; justify-content: space-between; gap: 8px; }
    .result span:first-child { color: #9ab6be; }
    .result strong { font-variant-numeric: tabular-nums; }
    .in { color: #7cf0b8; } .out { color: #ff8f7a; }
    .ghost { margin-top: 10px; width: 100%; background: transparent; }
    .land-tag { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 650; white-space: nowrap; color: #071721; background: #e9fff7; box-shadow: 0 4px 14px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
    .land-tag.out { background: #ffd3c9; }
    .axis { color: #8fb3b8; font-size: 11px; font-weight: 700; letter-spacing: .05em; opacity: .8; }
    #error { display: none; position: fixed; bottom: 85px; left: 24px; right: 24px; max-width: 560px; white-space: pre-wrap; color: #ffd9d9; background: rgba(110,28,35,.9); border: 1px solid #e17272; border-radius: 12px; padding: 15px; font-size: 13px; }
    @media (max-width: 700px) {
      .header { left: 15px; top: 14px; }
      .panel { top: auto; right: 12px; bottom: 72px; width: min(210px, 54vw); padding: 12px; }
      .subtitle { display: none; }
      .footer { left: 15px; right: 15px; bottom: 12px; font-size: 10px; }
      .metric { padding: 6px 0; font-size: 11px; }
      .panel { width: min(250px, 70vw); max-height: calc(100vh - 150px); }
      .dims { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <header class="header">
    <p class="eyebrow">REAL-TIME 3D REVIEW / STEP 01</p>
    <h1>Badminton Court</h1>
    <div class="subtitle">A reusable, full-scale 3D scene for landing-point visualization</div>
  </header>
  <aside class="panel">
    <div class="section" id="dropPanel"></div>
    <div class="section dims">
      <p class="panel-title">Court dimensions</p>
      <div class="metric"><span>Length</span><strong>13.40 m</strong></div>
      <div class="metric"><span>Doubles width</span><strong>6.10 m</strong></div>
      <div class="metric"><span>Singles width</span><strong>5.18 m</strong></div>
      <div class="metric"><span>Net height</span><strong>1.524-1.55 m</strong></div>
    </div>
    <div class="buttons"><button type="button" id="iso">3D View</button><button type="button" id="top">Top View</button></div>
  </aside>
  <div class="footer"><span class="pill">Drag to rotate &nbsp; · &nbsp; Scroll to zoom &nbsp; · &nbsp; Right-drag to pan</span><span class="status" id="status">● Scene ready</span></div>
  <div id="error" role="alert"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { setupShuttleDrop } from './shuttle.js';

    // 1 scene unit = 1 metre. Coordinates: X = width, Y = height, Z = length.
    // The court centre / net is (0, 0, 0). This stays consistent in later steps.
    const WIDTH = 6.10;
    const LENGTH = 13.40;
    const SINGLES_WIDTH = 5.18;
    const HALF_W = WIDTH / 2;
    const HALF_L = LENGTH / 2;
    const LINE = 0.04;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071823);
    scene.fog = new THREE.FogExp2(0x071823, 0.015);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(10, 12.5, 17);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('app').appendChild(renderer.domElement);

    // HTML labels (landing tag, axis hints) drawn on top of the WebGL canvas.
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
    document.getElementById('app').appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.55, 0);
    controls.minDistance = 6;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const hemi = new THREE.HemisphereLight(0xbcefff, 0x163e38, 2.6);
    scene.add(hemi);
    const keyLight = new THREE.DirectionalLight(0xfff9e8, 3.0);
    keyLight.position.set(-7, 17, 9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -18;
    keyLight.shadow.camera.right = 18;
    keyLight.shadow.camera.top = 18;
    keyLight.shadow.camera.bottom = -18;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const outerFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 33),
      new THREE.MeshStandardMaterial({ color: 0x152d35, roughness: 0.9, metalness: 0.0 })
    );
    outerFloor.rotation.x = -Math.PI / 2;
    outerFloor.position.y = -0.025;
    outerFloor.receiveShadow = true;
    scene.add(outerFloor);

    const border = new THREE.Mesh(
      new THREE.BoxGeometry(WIDTH + 1.1, 0.045, LENGTH + 1.1),
      new THREE.MeshStandardMaterial({ color: 0x0c5762, roughness: 0.94 })
    );
    border.position.y = 0;
    border.receiveShadow = true;
    scene.add(border);

    const court = new THREE.Mesh(
      new THREE.BoxGeometry(WIDTH, 0.025, LENGTH),
      new THREE.MeshStandardMaterial({ color: 0x15977e, roughness: 0.89, metalness: 0.02 })
    );
    court.position.y = 0.035;
    court.receiveShadow = true;
    scene.add(court);

    const lineMat = new THREE.MeshStandardMaterial({ color: 0xf4fbec, emissive: 0x1b2422, roughness: 0.5 });
    const LINE_Y = 0.053;
    function lineX(z, fromX = -HALF_W, toX = HALF_W) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(toX - fromX, 0.005, LINE), lineMat);
      line.position.set((fromX + toX) / 2, LINE_Y, z);
      scene.add(line);
    }
    function lineZ(x, fromZ = -HALF_L, toZ = HALF_L) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(LINE, 0.005, toZ - fromZ), lineMat);
      line.position.set(x, LINE_Y, (fromZ + toZ) / 2);
      scene.add(line);
    }

    // Doubles boundary, singles sidelines, short/long service lines, centre service lines.
    lineZ(-HALF_W); lineZ(HALF_W);
    lineX(-HALF_L); lineX(HALF_L);
    lineZ(-SINGLES_WIDTH / 2); lineZ(SINGLES_WIDTH / 2);
    lineX(-1.98); lineX(1.98);
    lineX(-HALF_L + 0.76); lineX(HALF_L - 0.76);
    lineZ(0, -HALF_L, -1.98);
    lineZ(0, 1.98, HALF_L);

    // Net and posts: top tape subtly curves from 1.55 m (posts) to 1.524 m (centre).
    const netHeight = x => 1.524 + (1.55 - 1.524) * Math.pow(Math.abs(x) / HALF_W, 1.6);
    const netMaterial = new THREE.LineBasicMaterial({ color: 0xddece9, transparent: true, opacity: 0.50, depthWrite: false });
    const netPoints = [];
    for (let x = -HALF_W; x <= HALF_W + 0.001; x += 0.10) {
      const xx = Math.min(x, HALF_W);
      netPoints.push(xx, 0.12, 0, xx, netHeight(xx) - 0.035, 0);
    }
    for (let y = 0.12; y <= 1.50; y += 0.10) {
      netPoints.push(-HALF_W, y, 0, HALF_W, y, 0);
    }
    const netGeo = new THREE.BufferGeometry();
    netGeo.setAttribute('position', new THREE.Float32BufferAttribute(netPoints, 3));
    const net = new THREE.LineSegments(netGeo, netMaterial);
    scene.add(net);

    const tapePts = [];
    for (let i = 0; i <= 64; i++) {
      const x = -HALF_W + WIDTH * i / 64;
      tapePts.push(new THREE.Vector3(x, netHeight(x), 0));
    }
    const tape = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tapePts), 64, 0.020, 6, false),
      new THREE.MeshStandardMaterial({ color: 0xf4fcf8, roughness: 0.48 })
    );
    scene.add(tape);

    for (const x of [-HALF_W, HALF_W]) {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.029, 0.035, 1.55, 12),
        new THREE.MeshStandardMaterial({ color: 0x152a30, metalness: 0.42, roughness: 0.4 })
      );
      post.position.set(x, 1.55 / 2, 0);
      post.castShadow = true;
      scene.add(post);
    }

    // Camera view presets. Step 2 will add point placement on this same court.
    let desiredPos = new THREE.Vector3(10, 12.5, 17);
    let desiredTarget = new THREE.Vector3(0, 0.55, 0);
    let movingCamera = false;
    function setCamera(x, y, z, tx = 0, ty = 0.55, tz = 0) {
      desiredPos.set(x, y, z);
      desiredTarget.set(tx, ty, tz);
      movingCamera = true;
    }
    document.getElementById('iso').addEventListener('click', () => setCamera(10, 12.5, 17));
    document.getElementById('top').addEventListener('click', () => setCamera(0.01, 21, 0.001, 0, 0, 0));
    controls.addEventListener('start', () => { movingCamera = false; });

    function axisLabel(text, x, z) {
      const el = document.createElement('div');
      el.className = 'axis';
      el.textContent = text;
      const obj = new CSS2DObject(el);
      obj.position.set(x, 0.1, z);
      scene.add(obj);
    }
    axisLabel('+X', HALF_W + 0.9, 0); axisLabel('−X', -HALF_W - 0.9, 0);
    axisLabel('+Z', 0, HALF_L + 0.9); axisLabel('−Z', 0, -HALF_L - 0.9);

    // Step 2: shuttle drop (shared with tripods.html).
    const statusEl = document.getElementById('status');
    const shuttleDrop = setupShuttleDrop({
      scene, camera, renderer,
      panelEl: document.getElementById('dropPanel'),
      onStatus: text => { statusEl.textContent = text ?? '● Scene ready'; },
    });

    function animate() {
      requestAnimationFrame(animate);
      shuttleDrop.update(performance.now());
      if (movingCamera) {
        camera.position.lerp(desiredPos, 0.095);
        controls.target.lerp(desiredTarget, 0.095);
        if (camera.position.distanceTo(desiredPos) < 0.01 && controls.target.distanceTo(desiredTarget) < 0.01) {
          camera.position.copy(desiredPos);
          controls.target.copy(desiredTarget);
          movingCamera = false;
        }
      }
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
